# Investment strategy config — copy to strategy.yaml and customize

# Language for human-facing output (summary markdown, briefs)
# JSON output is always English regardless of this setting
output_language: zh-CN            # zh-CN | en-US

# Investment principles (used by /portfolio)
# Natural-language guidance for the decision agent. These are NOT parsed for
# numbers — write every enforceable limit under `risk:` below.
#
# A number written ONLY here is NOT enforced. That used to be how it worked,
# and it was the fail-open this design removed: a limit sitting in prose
# could silently never bind, while the decision log kept attesting it.
#
# Remove this section to use the defaults in rules/portfolio-safety.md.
principles:
  # - "let winners run; cut the weakest name on rotation"
  # - "do not chase highs going into earnings"

# Mandate
mandate:
  style: concentrated_growth      # concentrated_growth | diversified_value | balanced
  edge: [AI, semiconductors, space]
  return_target: "50%+ annual"

# BQ scoring dimension weights (must sum to 1.0)
# Remove this section to use defaults: fundamental=0.35, forward=0.35, industry=0.30
scoring:
  dimension_weights:
    fundamental: 0.35
    forward: 0.35
    industry: 0.30

# Risk limits
risk:
  max_single_position: 0.20       # single stock cap

# Exit rules
exit:
  hard_triggers:
    - thesis_break
    - valuation_exhausted
    - risk_escalation
  stop_loss_atr_multiplier: 2.0

# Order preferences
orders:
  earnings_window_days: 7
